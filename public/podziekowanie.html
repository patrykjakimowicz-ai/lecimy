<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dziękujemy – Lecimy po swoje</title>
  <meta name="description" content="Status Twojego zamówienia w Lecimy po swoje." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="brand_assets/favicon.png" type="image/png" />
  <style>
    @font-face {
      font-family: 'SF Pro Text';
      src: local('SF Pro Text Medium'), url('/Library/Fonts/SF-Pro-Text-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <link rel="stylesheet" href="style.css" />
  <script src="tracking.js"></script>
  <!-- Analityka bez cookies (Plausible) — nie wymaga zgody, więc nie ma banera -->
  <script async src="https://plausible.io/js/pa-FJmUPwUSueTUbwNQCrnvE.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>
  <style>
    .thankyou {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-lg);
      text-align: center;
    }
    .thankyou__card { max-width: 480px; }
    .thankyou__icon {
      width: 64px; height: 64px; margin: 0 auto var(--sp-md);
      border-radius: 50%;
      background: rgba(232,120,12,0.1);
      border: 1.5px solid rgba(232,120,12,0.35);
      display: flex; align-items: center; justify-content: center;
      color: var(--clr-gold);
    }
    .thankyou h1 { margin-bottom: var(--sp-sm); }
    .thankyou p { color: var(--clr-text-muted); margin-bottom: var(--sp-md); line-height: 1.6; }
  </style>
</head>
<body>

  <main class="thankyou">
    <div class="thankyou__card">
      <div class="thankyou__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="30" height="30"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1 id="thankyouTitle">Sprawdzamy status zamówienia…</h1>
      <p id="thankyouMessage">
        Chwileczkę — potwierdzamy Twoją płatność w Przelewy24. To zwykle trwa kilka–kilkanaście sekund.
      </p>
      <a href="index.html" class="btn btn--primary btn--lg" id="thankyouBack">Wróć na stronę główną</a>
    </div>
  </main>

  <footer class="footer footer--mini">
    <div class="container">
      <div class="footer__payments">
        <img class="footer__payments-img" src="brand_assets/platnosci/p24-metody-platnosci-kompakt.png" width="1180" height="385" loading="lazy" decoding="async" alt="Płatności obsługuje Przelewy24: Apple Pay, Google Pay, BLIK, Visa, Mastercard i przelewy bankowe" />
      </div>
      <div class="footer__bottom">
        <p><a href="regulamin.html">Regulamin</a> · <a href="polityka-prywatnosci.html">Polityka prywatności</a></p>
        <p>Weska Academy Sp. z o.o. · ul. Złota 7/28, 00-019 Warszawa · NIP 5253083214 · REGON 544279185 · KRS 0001229728</p>
      </div>
    </div>
  </footer>


  <script>
    (function () {
      // Musi wskazywać na to samo co API_BASE w zamowienie.html — patrz komentarz tam.
      var API_BASE = 'https://lecimy-xlxt.onrender.com';

      var sid = new URLSearchParams(window.location.search).get('sid');
      var titleEl = document.getElementById('thankyouTitle');
      var msgEl = document.getElementById('thankyouMessage');
      var backEl = document.getElementById('thankyouBack');

      function setState(title, message) {
        titleEl.textContent = title;
        msgEl.textContent = message;
      }

      if (!sid) {
        setState('Nie znaleźliśmy zamówienia',
          'Jeśli dokonałeś zakupu, potwierdzenie i dostęp wyślemy na Twój e-mail (sprawdź też folder spam). W razie pytań napisz na kontakt@weskaacademy.pl.');
        return;
      }

      // Odpytanie statusu — webhook P24 zwykle dociera w kilka–kilkanaście sekund (maks. ok. 90 s).
      var attempts = 0;
      var MAX_ATTEMPTS = 30;
      var poll = setInterval(function () {
        attempts++;
        fetch(API_BASE + '/api/order/' + encodeURIComponent(sid))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            if (data && data.status === 'paid') {
              clearInterval(poll);
              setState('Dziękujemy za zakup!',
                'Płatność potwierdzona. Wysłaliśmy na Twój e-mail dostęp do konta i link do ustawienia hasła — sprawdź też folder spam.');
              // Pomiar zakupu (Plausible, bez cookies); jedno zdarzenie na zamówienie.
              if (window.lecimyTrack && data.amount) {
                var doneKey = 'lecimy_purchase_' + sid;
                var already = false;
                try { already = !!window.sessionStorage.getItem(doneKey); window.sessionStorage.setItem(doneKey, '1'); } catch (e) { /* brak storage */ }
                if (!already) {
                  window.lecimyTrack('purchase', {
                    transaction_id: sid,
                    value: data.amount / 100,
                    currency: data.currency || 'PLN',
                    item: data.pakiet,
                  });
                }
              }
            } else if (attempts >= MAX_ATTEMPTS) {
              clearInterval(poll);
              setState('Nie widzimy jeszcze potwierdzenia płatności',
                'Jeśli zapłaciłeś, potwierdzenie i dostęp przyjdą na Twój e-mail po zaksięgowaniu płatności (zwykle do kilku minut) — sprawdź też folder spam. Jeśli zrezygnowałeś z płatności, możesz wrócić do zamówienia.');
              backEl.textContent = 'Wróć do zamówienia';
              backEl.setAttribute('href', 'zamowienie.html');
            }
          })
          .catch(function () { /* chwilowy błąd sieci — próbujemy dalej do limitu prób */ });
      }, 3000);
    })();
  </script>

</body>
</html>
