<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel programu - Lecimy po swoje</title>
  <meta name="description" content="Panel programu Lecimy po swoje." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="brand_assets/favicon.png" type="image/png" />
  <style>
    @font-face {
      font-family: 'SF Pro Text';
      src: local('SF Pro Text Medium'), url('/Library/Fonts/SF-Pro-Text-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    /* Panel jest osobną aplikacją - nie chcemy globalnego tła strony głównej */
    body { background: var(--clr-bg); }
  </style>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="lms" id="lmsRoot" style="display:none;">

    <header class="lms__topbar">
      <button class="lms__menu-toggle" id="menuToggle" aria-label="Menu programu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <a href="index.html" class="nav__logo lms__logo"><img src="brand_assets/logo.png" alt="LECIMY" /></a>

      <div class="lms__progress">
        <div class="lms__progress-track"><div class="lms__progress-fill" id="progressFill"></div></div>
        <span class="lms__progress-label" id="progressLabel">0%</span>
      </div>

      <button class="btn btn--ghost lms__logout" id="logoutBtn" type="button">Wyloguj</button>
    </header>

    <div class="lms__sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="lms__body">
      <aside class="lms__sidebar" id="sidebar">
        <div id="sidebarModules"></div>
      </aside>

      <section class="lms__main" id="lessonMain">
        <!-- Wypełniane dynamicznie przez JS -->
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
  <script src="https://assets.mediadelivery.net/playerjs/player-0.1.0.min.js"></script>
  <script src="supabase-client.js"></script>
  <script src="edition.js"></script>
  <script>
    (function () {
      var client = window.supabaseClient;
      if (!client) return;

      // Treść programu NIE jest w tej stronie - serwer wysyła ją po zalogowaniu i tylko dla odblokowanych modułów.
      var API_BASE = /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname) ? '' : 'https://lecimy-xlxt.onrender.com';
      var COURSE = [];
      var ALL_LESSONS = [];
      var isAdmin = false;

      var els = {
        root: document.getElementById('lmsRoot'),
        sidebarModules: document.getElementById('sidebarModules'),
        lessonMain: document.getElementById('lessonMain'),
        progressFill: document.getElementById('progressFill'),
        progressLabel: document.getElementById('progressLabel'),
        sidebar: document.getElementById('sidebar'),
        sidebarBackdrop: document.getElementById('sidebarBackdrop'),
        menuToggle: document.getElementById('menuToggle'),
        logoutBtn: document.getElementById('logoutBtn'),
      };

      var currentUserId = null;
      var progressKey = null;
      var completed = {};
      var activeLessonId = null;

      var progress = {};   // lessonId → { watched, duration, done } (zapisane na serwerze)

      function authHeaders() {
        return client.auth.getSession().then(function (r) {
          var sess = r.data && r.data.session;
          return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (sess ? sess.access_token : '') };
        });
      }

      function loadProgress() {
        return authHeaders().then(function (h) {
          return fetch(API_BASE + '/api/panel/progress', { headers: h });
        }).then(function (res) { return res.ok ? res.json() : { lessons: {} }; })
          .then(function (body) {
            progress = body.lessons || {};
            completed = {};
            Object.keys(progress).forEach(function (id) { if (progress[id] && progress[id].done) completed[id] = true; });
          }).catch(function () { progress = {}; completed = {}; });
      }

      function updateProgressBar() {
        var doneCount = ALL_LESSONS.filter(function (l) { return completed[l.id]; }).length;
        var pct = ALL_LESSONS.length ? Math.round((doneCount / ALL_LESSONS.length) * 100) : 0;
        els.progressFill.style.width = pct + '%';
        els.progressLabel.textContent = pct + '%';
      }

      function findLesson(lessonId) {
        return ALL_LESSONS.filter(function (l) { return l.id === lessonId; })[0] || null;
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function renderSidebar() {
        els.sidebarModules.innerHTML = COURSE.map(function (mod, modIndex) {
          if (mod.locked) {
            return (
              '<div class="lms__module lms__module--locked" style="opacity:.6;">' +
                '<div class="lms__module-summary js-locked" style="cursor:pointer;" data-title="' + escapeHtml(mod.title) + '" data-note="' + escapeHtml(mod.lockNote || '') + '">' +
                  '<span>\uD83D\uDD12 ' + escapeHtml(mod.title) + '</span>' +
                  '<span class="lms__module-count">' + escapeHtml(mod.lockNote || '') + '</span>' +
                '</div>' +
              '</div>'
            );
          }
          var lessonsHtml = mod.lessons.map(function (lesson, i) {
            if (lesson.locked) {
              return (
                '<div class="lms__lesson js-locked" style="opacity:.6;cursor:pointer;" data-title="' + escapeHtml(lesson.title) + '" data-note="' + escapeHtml(lesson.lockNote || '') + '">' +
                  '<span class="lms__lesson-title" style="padding-inline-start:8px;">\uD83D\uDD12 ' + escapeHtml(lesson.title) + ' <small>(' + escapeHtml(lesson.lockNote || '') + ')</small></span>' +
                '</div>'
              );
            }
            var isActive = lesson.id === activeLessonId;
            var isDone = !!completed[lesson.id];
            return (
              '<div class="lms__lesson' + (isActive ? ' is-active' : '') + (isDone ? ' is-done' : '') + '" data-lesson-id="' + lesson.id + '">' +
                '<input type="checkbox" class="lms__lesson-check" disabled data-lesson-id="' + lesson.id + '"' + (isDone ? ' checked' : '') + ' aria-label="Lekcja zaliczona po obejrzeniu" title="Lekcja zalicza się automatycznie po obejrzeniu" />' +
                '<button type="button" class="lms__lesson-btn" data-lesson-id="' + lesson.id + '">' +
                  '<span class="lms__lesson-title">' + (lesson.num && lesson.num !== 'M' ? escapeHtml(lesson.num) + ' ' : '') + escapeHtml(lesson.title) + '</span>' +
                '</button>' +
              '</div>'
            );
          }).join('');

          var unlockedLessons = mod.lessons.filter(function (l) { return !l.locked; });
          var doneInModule = unlockedLessons.filter(function (l) { return completed[l.id]; }).length;
          var isOpen = unlockedLessons.some(function (l) { return l.id === activeLessonId; }) || (!activeLessonId && modIndex === 0);

          return (
            '<details class="lms__module"' + (isOpen ? ' open' : '') + '>' +
              '<summary class="lms__module-summary">' +
                '<span>' + escapeHtml(mod.title) + '</span>' +
                '<span style="display:flex; align-items:center; gap:8px;">' +
                  '<span class="lms__module-count">' + doneInModule + '/' + unlockedLessons.length + '</span>' +
                  '<svg class="lms__module-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="6 9 12 15 18 9"/></svg>' +
                '</span>' +
              '</summary>' +
              '<div class="lms__lesson-list">' + lessonsHtml + '</div>' +
            '</details>'
          );
        }).join('');

        // Zablokowany moduł / lekcja: ekran z powodem blokady (bez treści)
        els.sidebarModules.querySelectorAll('.js-locked').forEach(function (el) {
          el.addEventListener('click', function () {
            stopTracker();
            els.lessonMain.innerHTML =
              '<div style="text-align:center;padding:64px 16px;">' +
                '<div style="font-size:48px;">\uD83D\uDD12</div>' +
                '<h2 class="lms__lesson-title-main">' + escapeHtml(el.dataset.title) + '</h2>' +
                '<p class="lms__lesson-desc">' + escapeHtml(el.dataset.note) + '</p>' +
              '</div>';
            closeSidebarOnMobile();
          });
        });

        // Kliknięcie w tytuł lekcji → otwórz ją
        els.sidebarModules.querySelectorAll('.lms__lesson-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            selectLesson(btn.dataset.lessonId);
            closeSidebarOnMobile();
          });
        });
      }

      function renderLesson() {
        var lesson = findLesson(activeLessonId);
        if (!lesson) {
          els.lessonMain.innerHTML = '<p>Wybierz lekcję z menu po lewej.</p>';
          return;
        }

        stopTracker();
        var materialsHtml = lesson.materials && lesson.materials.length
          ? '<div class="lms__material-list">' + lesson.materials.map(function (m) {
              return (
                '<a class="lms__material-item" href="' + m.url + '" target="_blank" rel="noopener">' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
                  '<span>' + escapeHtml(m.label) + '</span>' +
                '</a>'
              );
            }).join('') + '</div>'
          : '<p class="lms__materials-empty">Brak materiałów do pobrania dla tej lekcji.</p>';

        els.lessonMain.innerHTML =
          '<div class="lms__video-wrap"><iframe id="lessonPlayer" src="' + lesson.video + '" title="' + escapeHtml(lesson.title) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>' +
          '<h2 class="lms__lesson-title-main">' + escapeHtml(lesson.title) + '</h2>' +
          '<p class="lms__lesson-desc">' + escapeHtml(lesson.description) + '</p>' +
          '<p id="lessonStatus" class="lms__lesson-desc" style="font-weight:600;"></p>' +
          '<div class="lms__materials">' +
            '<h3>Materiały do pobrania</h3>' +
            materialsHtml +
          '</div>';

        updateStatus(lesson);
        startTracker(lesson);
      }

      function selectLesson(lessonId) {
        activeLessonId = lessonId;
        renderSidebar();
        renderLesson();
      }

      // ── Śledzenie oglądania (Bunny Stream + player.js) ──
      // Liczymy tylko sekundy faktycznie odtworzone w sposób ciągły. Przewinięcie do przodu NIE zalicza fragmentu.
      var tracker = null;
      var BUNNY_RE = /^https:\/\/iframe\.mediadelivery\.net\//;

      function updateStatus(lesson) {
        var el = document.getElementById('lessonStatus');
        if (!el) return;
        var p = progress[lesson.id];
        if (!BUNNY_RE.test(lesson.video)) { el.textContent = isAdmin ? 'Tryb testowy: ten film nie jest śledzony (to nie jest Bunny).' : ''; return; }
        if (p && p.done) { el.textContent = '✓ Lekcja zaliczona'; el.style.color = 'var(--clr-gold)'; return; }
        var pct = p && p.duration ? Math.min(100, Math.round(p.watched / p.duration * 100)) : 0;
        el.style.color = '';
        el.textContent = 'Obejrzano ' + pct + '%. Lekcja zalicza się automatycznie po obejrzeniu (około 90%) - bez przewijania.';
      }

      function stopTracker() {
        if (tracker) { tracker.stop(); tracker = null; }
      }

      function startTracker(lesson) {
        var iframe = document.getElementById('lessonPlayer');
        if (!iframe || !BUNNY_RE.test(lesson.video) || typeof playerjs === 'undefined') return;
        var player = new playerjs.Player(iframe);
        var last = null, pending = 0, duration = 0, position = 0, playing = false, stopped = false, lastSent = 0;
        var saved = progress[lesson.id] || {};
        var finished = !!saved.done;                 // zaliczona lekcja: swobodne przewijanie (powtórki)
        var frontier = saved.frontier || 0;          // dokąd realnie obejrzano - dalej nie wolno przewinąć
        var notice = 0;

        function send(force) {
          if (stopped || pending < 0.5 || (!force && Date.now() - lastSent < 2500)) return;
          var delta = pending; pending = 0; lastSent = Date.now();
          authHeaders().then(function (h) {
            return fetch(API_BASE + '/api/panel/heartbeat', { method: 'POST', headers: h, keepalive: true,
              body: JSON.stringify({ lessonId: lesson.id, delta: delta, duration: duration, position: position, frontier: frontier }) });
          }).then(function (res) { return res.ok ? res.json() : null; }).then(function (r) {
            if (!r) { pending += delta; return; }
            var wasDone = !!(progress[lesson.id] && progress[lesson.id].done);
            progress[lesson.id] = r;
            if (r.done) finished = true;
            if (r.frontier > frontier) frontier = r.frontier;
            if (r.done) completed[lesson.id] = true;
            if (lesson.id === activeLessonId) updateStatus(lesson);
            if (r.done && !wasDone) { updateProgressBar(); renderSidebar(); }
          }).catch(function () { pending += delta; });
        }

        function showSeekNotice() {
          var el = document.getElementById('lessonStatus');
          if (!el || Date.now() - notice < 4000) return;
          notice = Date.now();
          var prevText = el.textContent;
          el.textContent = 'Nie możesz przewinąć dalej niż obejrzany fragment. Wróciliśmy do miejsca, w którym skończyłeś oglądać.';
          setTimeout(function () { if (lesson.id === activeLessonId) updateStatus(lesson); }, 4000);
        }

        var wired = false;
        player.on('ready', function () {
          if (wired) return;                           // 'ready' potrafi przyjść kilka razy - podpinamy tylko raz
          wired = true;
          // Wznowienie: zacznij tam, gdzie skończyłeś (o ile to nie początek).
          if (!finished && frontier > 5) player.setCurrentTime(frontier);
          player.on('timeupdate', function (d) {
            duration = d.duration || duration;
            position = d.seconds;
            var step = last === null ? null : d.seconds - last;
            // Ciągłe odtwarzanie (mały krok do przodu) - zawsze liczymy, niezależnie od zdarzeń play/pause.
            if (step !== null && step > 0 && step <= 2.5) {
              pending += step;
              if (d.seconds > frontier) frontier = d.seconds;
              last = d.seconds;
              return;
            }
            // Skok (przewinięcie): dalej niż obejrzano -> wracamy do granicy obejrzanego fragmentu.
            if (!finished && d.seconds > frontier + 3) {
              last = null;
              player.setCurrentTime(frontier);
              showSeekNotice();
              return;
            }
            last = d.seconds;
          });
          player.on('play', function () { playing = true; });
          player.on('pause', function () { playing = false; last = null; setTimeout(function () { send(false); }, 2600); });
          player.on('ended', function () { playing = false; last = null; setTimeout(function () { send(false); }, 2600); });
        });

        var timer = setInterval(function () { send(false); }, 10000);
        var onHide = function () { send(true); };
        window.addEventListener('pagehide', onHide);
        tracker = { stop: function () { send(true); stopped = true; clearInterval(timer); window.removeEventListener('pagehide', onHide); } };
      }

      function openSidebar() {
        els.sidebar.classList.add('is-open');
        els.sidebarBackdrop.classList.add('is-open');
      }
      function closeSidebar() {
        els.sidebar.classList.remove('is-open');
        els.sidebarBackdrop.classList.remove('is-open');
      }
      function closeSidebarOnMobile() {
        if (window.matchMedia('(max-width: 860px)').matches) closeSidebar();
      }

      els.menuToggle.addEventListener('click', function () {
        if (els.sidebar.classList.contains('is-open')) closeSidebar();
        else openSidebar();
      });
      els.sidebarBackdrop.addEventListener('click', closeSidebar);

      els.logoutBtn.addEventListener('click', function () {
        els.logoutBtn.disabled = true;
        client.auth.signOut().finally(function () {
          window.location.href = 'logowanie.html';
        });
      });

      function initCourse(data) {
        COURSE = data.modules || [];
        isAdmin = !!data.admin;
        ALL_LESSONS = COURSE.reduce(function (acc, mod) { return acc.concat((mod.lessons || []).filter(function (l) { return !l.locked; })); }, []);
        activeLessonId = ALL_LESSONS.length ? ALL_LESSONS[0].id : null;
        loadProgress().then(function () {
          renderSidebar();
          renderLesson();
          updateProgressBar();
        });
        if (isAdmin) {
          var adminLink = document.createElement('a');
          adminLink.href = 'postepy.html';
          adminLink.textContent = 'Postępy uczestników';
          adminLink.style.cssText = 'font-size:12px;font-weight:600;color:var(--clr-gold);margin-inline-end:12px;';
          els.logoutBtn.parentNode.insertBefore(adminLink, els.logoutBtn);
          var badge = document.createElement('span');
          badge.textContent = 'ADMIN \u2013 widzisz wszystkie moduły';
          badge.style.cssText = 'font-size:12px;font-weight:600;color:var(--clr-gold);margin-inline-end:12px;';
          els.logoutBtn.parentNode.insertBefore(badge, els.logoutBtn);
          var q = new URLSearchParams(window.location.search);
          var bar = document.createElement('div');
          bar.style.cssText = 'font-size:12px;padding:8px 16px;background:rgba(212,175,55,.12);color:var(--clr-gold);display:flex;gap:10px;flex-wrap:wrap;align-items:center;';
          bar.innerHTML = '<strong>Podgląd jako uczestnik:</strong>' +
            '<select id="pvAs"><option value="">ja (admin)</option><option value="fundament">Fundament</option><option value="system">Kompletny System</option></select>' +
            '<label><input type="checkbox" id="pvMc"> z Masterclassem</label>' +
            '<select id="pvDate"><option value="">dziś</option><option value="2026-12-21">po 20.12</option><option value="2027-01-21">po 20.01</option></select>';
          document.body.insertBefore(bar, document.body.firstChild);
          document.getElementById('pvAs').value = q.get('as') || '';
          document.getElementById('pvMc').checked = q.get('masterclass') === '1';
          document.getElementById('pvDate').value = q.get('date') || '';
          var go = function () {
            var as = document.getElementById('pvAs').value, p = new URLSearchParams();
            if (as) {
              p.set('as', as);
              if (document.getElementById('pvMc').checked) p.set('masterclass', '1');
              if (document.getElementById('pvDate').value) p.set('date', document.getElementById('pvDate').value);
            }
            window.location.search = p.toString();
          };
          ['pvAs', 'pvMc', 'pvDate'].forEach(function (id) { document.getElementById(id).addEventListener('change', go); });
        }
        // Informacja o starcie liczenia 3 miesięcy: widoczna tylko 22 i 23.11.2026
        if (Date.now() < Date.parse('2026-11-24T00:00:00+01:00')) {
          var note = document.createElement('div');
          note.style.cssText = 'font-size:14px;line-height:1.5;padding:10px 16px;text-align:center;background:rgba(212,175,55,.14);color:var(--clr-gold);border-bottom:1px solid rgba(212,175,55,.3);';
          note.innerHTML = '<strong>Ważna informacja:</strong> w rekompensacie za opóźnienie startu okres 3 miesięcy dostępu liczymy dopiero od jutra, czyli od 23.11.2026.';
          document.body.insertBefore(note, document.body.firstChild);
        }
        els.root.style.display = '';
      }

      function showGate(title, text, showOffer) {
        var box = document.createElement('div');
        box.style.cssText = 'min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;';
        box.innerHTML =
          '<div style="max-width:520px;">' +
            '<h1 style="margin-bottom:12px;">' + escapeHtml(title) + '</h1>' +
            '<p style="color:var(--clr-text-muted);line-height:1.6;margin-bottom:24px;">' + escapeHtml(text) + '</p>' +
            (showOffer ? '<p><a class="btn btn--primary" href="index.html#pricing">Zobacz ofertę</a></p>' : '') +
            '<p style="margin-top:16px;"><button type="button" id="gateLogout" class="btn btn--outline">Wyloguj się</button></p>' +
          '</div>';
        document.body.appendChild(box);
        document.getElementById('gateLogout').addEventListener('click', function () {
          client.auth.signOut().finally(function () { window.location.href = 'logowanie.html'; });
        });
      }

      // ── Zabezpieczenie: sesja + zgoda serwera (blokada platformy, admin, moduły) ──
      client.auth.getSession().then(function (result) {
        var session = result.data && result.data.session;
        if (!session) {
          window.location.replace('logowanie.html');
          return;
        }
        currentUserId = session.user.id;
        

        return fetch(API_BASE + '/api/panel/course' + window.location.search, { headers: { Authorization: 'Bearer ' + session.access_token } })
          .then(function (res) {
            if (res.status === 401) { showGate('Sesja nie została rozpoznana', 'Wyloguj się i zaloguj ponownie. Jeśli problem wraca, napisz do nas: lecimyposwoje2020@gmail.com.', false); return null; }
            return res.json().then(function (body) { return { status: res.status, body: body }; });
          })
          .then(function (r) {
            if (!r) return;
            if (r.status === 403) {
              showGate(r.body.state === 'after' ? 'Edycja zakończona' : 'Platforma otwiera się wkrótce', r.body.message || '', r.body.state === 'after');
              return;
            }
            if (r.status !== 200) throw new Error('panel ' + r.status);
            initCourse(r.body);
          });
      }).catch(function () {
        showGate('Nie udało się wczytać panelu', 'Odśwież stronę za chwilę. Jeśli problem wraca, napisz do nas: lecimyposwoje2020@gmail.com.', false);
      });

      // Jeśli sesja wygaśnie / użytkownik wyloguje się w innej karcie - wyrzuć z panelu
      client.auth.onAuthStateChange(function (event) {
        if (event === 'SIGNED_OUT') {
          window.location.replace('logowanie.html');
        }
      });
    })();
  </script>

</body>
</html>
